<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shivu AI Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f1117] text-white font-sans flex flex-col justify-between h-screen m-0">

    <!-- Top Navbar -->
    <header class="bg-[#161b22] border-b border-zinc-800 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <span class="bg-purple-600 text-white font-black px-2.5 py-1 rounded-lg text-xs shadow-lg">⚡ AI</span>
            <h1 class="text-lg font-black tracking-wider text-purple-400">SHIVU AI <span class="text-xs text-zinc-400 font-normal">PRO</span></h1>
        </div>
    </header>

    <!-- Chat Conversation Area -->
    <div id="chat-container" class="max-w-4xl w-full mx-auto px-4 py-6 flex-grow flex flex-col gap-4 overflow-y-auto">
        <div class="flex justify-start">
            <div class="max-w-[85%] bg-[#1f242d] border border-zinc-700 text-zinc-200 p-4 rounded-2xl rounded-bl-none text-xs sm:text-sm leading-relaxed shadow-md font-mono whitespace-pre-wrap">
Yo! Main Shivu AI hoon. Batao kya help chahiye?</div>
        </div>
    </div>

    <!-- Bottom Input Box -->
    <div class="bg-[#161b22] border-t border-zinc-800 p-4 sticky bottom-0">
        <div class="max-w-4xl mx-auto flex gap-2">
            <input 
                type="text" 
                id="user-input"
                placeholder="Type your message here..." 
                class="flex-grow bg-[#0d1117] border border-zinc-700 text-xs sm:text-sm px-4 py-3 rounded-xl text-white focus:outline-none focus:border-purple-500 shadow-inner"
            />
            <button 
                onclick="sendMessage()"
                class="bg-purple-600 hover:bg-purple-500 text-white font-extrabold text-xs sm:text-sm px-6 py-3 rounded-xl transition shadow-lg cursor-pointer"
            >
                Send 🚀
            </button>
        </div>
    </div>

    <script>
        // APNI API KEY YAHAN PASTE KARO (Quotes ke andar)
        const API_KEY = 'YAHAN_APNI_API_KEY_DAAL';

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatContainer = document.getElementById('chat-container');
            const text = inputField.value.trim();

            if (!text) return;

            // User Message
            chatContainer.innerHTML += `
                <div class="flex justify-end">
                    <div class="max-w-[85%] bg-purple-600 text-white p-4 rounded-2xl rounded-br-none text-xs sm:text-sm font-medium shadow-md">
                        ${text}
                    </div>
                </div>
            `;
            inputField.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Loading
            const loadId = 'load-' + Date.now();
            chatContainer.innerHTML += `
                <div id="${loadId}" class="flex justify-start">
                    <div class="bg-[#1f242d] border border-zinc-700 text-zinc-400 p-3 rounded-2xl text-xs animate-pulse">
                        Thinking...
                    </div>
                </div>
            `;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "You are Shivu AI, a cool coding assistant. User says: " + text }] }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadId).remove();

                let reply = "Kuch error aa gaya response mein.";
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    reply = data.candidates[0].content.parts[0].text;
                }

                chatContainer.innerHTML += `
                    <div class="flex justify-start">
                        <div class="max-w-[85%] bg-[#1f242d] border border-zinc-700 text-zinc-200 p-4 rounded-2xl rounded-bl-none text-xs sm:text-sm leading-relaxed shadow-md font-mono whitespace-pre-wrap">${reply}</div>
                    </div>
                `;
                chatContainer.scrollTop = chatContainer.scrollHeight;

            } catch (err) {
                document.getElementById(loadId).remove();
                chatContainer.innerHTML += `
                    <div class="flex justify-start">
                        <div class="bg-red-900 border border-red-500 text-white p-4 rounded-2xl text-xs">Connection Error! API Key check karo.</div>
                    </div>
                `;
            }
        }

        document.getElementById('user-input').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
